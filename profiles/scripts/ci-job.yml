  __JOB__:
    name: __JOB__ (scripts)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: __PATH__
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run pip-audit
